<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Gallery – ACC Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-layout="admin">
  <header class="site-header" id="site-header"></header>

  <main>
    <section class="section">
      <div class="container">
        <div class="admin-bar">
          <h1>Manage Gallery Items</h1>
          <button class="btn btn-primary" id="open-create-btn" type="button">+ Add Image</button>
        </div>

        <div id="admin-alert"></div>

        <!-- Create / Edit Form Panel -->
        <div id="gallery-form-panel" class="panel hidden" style="margin-bottom: 32px;">
          <h2 id="form-heading" style="margin-bottom: 20px;">Add Gallery Image</h2>

          <form id="gallery-form" enctype="multipart/form-data">
            <input type="hidden" id="gallery-id" name="id">

            <div class="form-grid">
              <div class="form-row">
                <label for="title">Title *</label>
                <input type="text" id="title" name="title" maxlength="100" required placeholder="e.g. Monza Sunset">
                <div class="field-hint">Max 100 characters.</div>
              </div>

              <div class="form-row">
                <label for="image" id="image-label">Image File *</label>
                <input type="file" id="image" name="image" accept="image/jpeg,image/png,image/webp">
                <div class="field-hint" id="image-hint">Allowed formats: JPG, PNG, WEBP (max 5 MB).</div>
                <img id="image-preview" class="image-preview hidden" src="" alt="Image preview">
              </div>
            </div>

            <div class="form-row">
              <label for="description">Description *</label>
              <textarea id="description" name="description" rows="3" maxlength="500" required placeholder="Describe the scene, circuit or car."></textarea>
              <div class="field-hint">Max 500 characters.</div>
            </div>

            <div class="form-actions" style="margin-top: 24px;">
              <button class="btn btn-primary" type="submit" id="save-gallery-btn">Save Image</button>
              <button class="btn btn-secondary" type="button" id="cancel-btn">Cancel</button>
            </div>
          </form>
        </div>

        <!-- Gallery Table -->
        <div id="gallery-table-container">
          <p class="loading">Loading gallery items…</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="/js/utils.js"></script>
  <script src="/admin/gallery.js"></script>
</body>
</html>
