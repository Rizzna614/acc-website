<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery – ACC Fan Site</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1>Gallery</h1>
        <p class="lead">In-game photography, competitive racing action, and cinematic screenshots.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div id="gallery-container">
          <p class="loading">Loading gallery images…</p>
        </div>
      </div>
    </section>
  </main>

  <div id="lightbox" class="lightbox-backdrop hidden" role="dialog" aria-modal="true" aria-label="Image preview">
    <div class="lightbox-content">
      <div class="lightbox-header" style="padding: 12px 16px; border-bottom: 1px solid var(--border);">
        <h3 id="lightbox-title" style="margin: 0; font-size: 1.1rem;"></h3>
        <button id="lightbox-close" class="lightbox-close" type="button" aria-label="Close image">&times;</button>
      </div>
      <img id="lightbox-img" src="" alt="">
      <div class="lightbox-body">
        <p id="lightbox-desc" class="muted" style="margin: 0;"></p>
      </div>
    </div>
  </div>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="/js/utils.js"></script>
  <script src="/js/gallery.js"></script>
</body>
</html>
