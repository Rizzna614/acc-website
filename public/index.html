<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home – ACC Fan Site</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main>
    <section class="hero">
      <div class="container hero-inner">
        <div class="hero-text" id="hero-text">
          <h1 id="game-title">Loading…</h1>
          <p class="lead" id="game-summary"></p>
          <div class="hero-actions">
            <a class="btn btn-primary" href="/content.html">Explore cars &amp; circuits</a>
            <a class="btn btn-secondary" href="/news.html">Read the news</a>
          </div>
        </div>
        <div class="hero-image">
          <img src="/images/hero.jpg" alt="GT3 race cars on track">
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-header">
          <h2>Latest news</h2>
          <a href="/news.html">All news →</a>
        </div>
        <div id="news-content">
          <p class="loading">Loading news…</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="/js/utils.js"></script>
  <script src="/js/home.js"></script>
</body>
</html>
