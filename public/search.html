<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search – ACC Fan Site</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1>Search Results</h1>
        <p class="lead" id="search-summary">Search for cars, circuits, and news.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <form class="search-form" id="page-search-form" style="max-width: 500px; margin-bottom: 32px; display: flex; gap: 8px;">
          <input type="search" id="page-search-input" placeholder="Search cars, circuits, news…" minlength="2" maxlength="100" required>
          <button class="btn btn-primary" type="submit">Search</button>
        </form>

        <div id="search-results-container">
          <p class="loading">Enter a query to search.</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="/js/utils.js"></script>
  <script src="/js/search.js"></script>
</body>
</html>
