<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News – ACC Fan Site</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1>News &amp; Guides</h1>
        <p class="lead">The latest updates, gameplay guides, and community announcements.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="tabs" id="news-category-tabs" role="tablist" aria-label="News categories" style="display: none;"></div>
        <div id="news-list-container">
          <p class="loading">Loading news articles…</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="/js/utils.js"></script>
  <script src="/js/news.js"></script>
</body>
</html>
