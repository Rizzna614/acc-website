<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Content – ACC Fan Site</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1>Game Content</h1>
        <p class="lead">Explore the official GT3 and GT4 race cars and world-class racing circuits.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="tabs" id="content-tabs" role="tablist" aria-label="Content filter">
          <button class="tab active" data-filter="all" type="button">All Content</button>
          <button class="tab" data-filter="GT3" type="button">GT3 Cars</button>
          <button class="tab" data-filter="GT4" type="button">GT4 Cars</button>
          <button class="tab" data-filter="circuits" type="button">Circuits</button>
        </div>

        <div id="content-container">
          <p class="loading">Loading cars and circuits…</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="/js/utils.js"></script>
  <script src="/js/content.js"></script>
</body>
</html>
